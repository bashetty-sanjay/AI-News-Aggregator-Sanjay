databases:
  - name: news2u-db
    databaseName: news2u_db
    user: news2u_user
    plan: free

services:
  # -------------------------------------------------------------
  # Web Service (Landing Page, Subscription API & Pipeline Webhook)
  # 100% Free on Render - No credit card required!
  # -------------------------------------------------------------
  - type: web
    name: news2u
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "uvicorn app.web:app --host 0.0.0.0 --port ${PORT:-8000}"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news2u-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MY_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: USER_NAME
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: CRON_SECRET
        generateValue: true

  # -------------------------------------------------------------
  # Optional: Render Native Cron Job
  # NOTE: Render does NOT have a free plan for cron jobs.
  # Cron on Render requires "plan: starter" (paid).
  # To keep your deployment 100% FREE ($0), run the daily digest
  # by scheduling a free daily ping to:
  # https://news2u.onrender.com/api/cron/run via cron-job.org or GitHub Actions!
  # If you prefer Render's paid cron, uncomment the block below:
