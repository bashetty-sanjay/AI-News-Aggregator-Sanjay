name: Daily News Digest Trigger

on:
  schedule:
    # 7:00 AM IST (UTC+5:30) = 1:30 AM UTC
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger News2U Daily Digest
        run: |
          echo "Pinging News2U Web Service to scrape, curate, and send daily digests..."
          curl -f -s -X POST https://news2u.onrender.com/api/cron/run || curl -f -s https://news2u.onrender.com/api/cron/run
